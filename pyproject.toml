[project]
name = "policyqa"
version = "0.1.0"
description = "Policy Document QA with citations: hybrid retrieval over public healthcare policy PDFs, scored against a human-verified golden set."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "rank_bm25>=0.2.2",
  "sentence-transformers>=3.0",
  "numpy>=1.26",
  "httpx>=0.27",
  "anthropic>=1.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.115", "uvicorn>=0.30"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["policyqa*", "api*"]
